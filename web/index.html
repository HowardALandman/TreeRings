<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>European Tree-Ring Archive</title>
<meta name="description" content="123,370 individual subfossil and historical tree logs from the ITRDB and PANGAEA on one time axis, 12,429 BC to 2025 CE, coloured by taxon.">

<!-- Link previews.  These have to be static: Facebook, LinkedIn, Slack and
     Discord read the served HTML and do not run app.js, so nothing the
     viewer draws into <canvas> is visible to them.  og:image must be an
     absolute URL - a relative one is the usual reason a card comes up blank -
     and the explicit width/height let the large card render on first scrape
     instead of waiting for the crawler to fetch and measure the file.
     Facebook caches its verdict per URL, so after changing any of this run
     the URL through developers.facebook.com/tools/debug/ and Scrape Again. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="European Tree-Ring Archive">
<meta property="og:url" content="https://treerings.howardalandman.org/">
<!-- Not the same string as og:site_name: Facebook stacks the two, so
     repeating the name there prints it twice and leaves the card looking
     empty.  The site name identifies the site; the title says what is in it. -->
<meta property="og:title" content="123,370 tree logs on one time axis">
<meta property="og:description" content="123,370 individual subfossil and historical tree logs from the ITRDB and PANGAEA on one time axis, 12,429 BC to 2025 CE, coloured by taxon.">
<meta property="og:image" content="https://treerings.howardalandman.org/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Map of Europe with 1,463 circles, one per tree-ring sampling location, sized by number of logs and coloured by taxon: pine across Scandinavia, Iberia and the eastern Mediterranean, oak across Britain, Ireland and the north European plain, and spruce, fir and mixed pies packed into the Alps.">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header>
    <h1>European Tree-Ring Archive</h1>
    <span class="subtitle" id="headline">loading…</span>
    <span class="spacer"></span>
    <button id="theme" title="Toggle light / dark">◐</button>
  </header>

  <div class="controls">
    <div class="control segmented" role="group" aria-label="View">
      <button id="view-timeline" aria-pressed="true">Timeline</button>
      <button id="view-map" aria-pressed="false">Map</button>
    </div>

    <div class="control" id="ctl-mode">
      <label for="mode">Layout</label>
      <select id="mode">
        <option value="band">By taxon</option>
        <option value="unified">Packed together</option>
      </select>
    </div>

    <div class="control">
      <label for="era">Era</label>
      <select id="era">
        <option value="all">All time</option>
        <option value="pre1000">Before 1000 CE</option>
        <option value="pre1500">Before 1500 CE</option>
        <option value="medieval">500 – 1500 CE</option>
        <option value="ancient">Before 1 CE</option>
        <option value="lateglacial">Before 10,000 BC</option>
      </select>
    </div>

    <div class="control" id="ctl-size" hidden>
      <label for="size">Circle size</label>
      <input type="range" id="size" min="0.3" max="2.2" step="0.05" value="1.2">
    </div>

    <div class="control">
      <button id="reset">Reset view</button>
    </div>

    <button id="place-chip" hidden title="Show every collection again"></button>

    <span class="spacer"></span>
    <div class="legend" id="legend"></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div id="tooltip" role="status" aria-live="polite"></div>

    <aside id="detail" aria-label="Log detail">
      <button class="close" id="detail-close" aria-label="Close">×</button>
      <h2 id="d-title">—</h2>
      <div class="sub" id="d-sub"></div>
      <button id="d-map">Show on map</button>
      <canvas id="spark"></canvas>
      <div class="spark-caption" id="d-spark-caption"></div>
      <dl id="d-fields"></dl>
    </aside>

    <aside id="place" aria-label="Collections at this place">
      <button class="close" id="place-close" aria-label="Close">×</button>
      <h2 id="p-title">—</h2>
      <div class="sub" id="p-sub"></div>
      <button id="p-show">Show on timeline</button>
      <table id="p-table"></table>
    </aside>

    <div id="loading">loading corpus…</div>
  </div>

  <footer>
    <span id="f-counts"></span>
    <span id="f-provenance"></span>
    <span id="f-help">Drag to pan · wheel to zoom · shift+wheel rows only · alt+wheel time only</span>
    <button id="f-more" aria-expanded="false">more</button>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
